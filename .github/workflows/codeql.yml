name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  # Intentionally no `branches:` filter: every PR runs CI regardless of its
  # base branch, so stacked PRs (base = another feature branch) are verified
  # too. A branch allowlist silently skips CI for any new naming scheme.
  pull_request:
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
