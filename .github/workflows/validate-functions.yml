name: Validate Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/validate-functions.yml'
  # Intentionally no `branches:` filter: every PR runs CI regardless of its
  # base branch, so stacked PRs (base = another feature branch) are verified
  # too. A branch allowlist silently skips CI for any new naming scheme.
  # The `paths:` filter below still scopes this to relevant changes.
  pull_request:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/validate-functions.yml'

permissions:
  contents: read

jobs:
  validate-functions:
    name: validate-functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: functions
        run: pnpm install --frozen-lockfile

      - name: Check deploy lockfile
        # functions/package-lock.json is what the production Cloud Build
        # installs from (firebase deploy uploads only functions/, never the
        # root pnpm-lock.yaml). Fail if it drifted from package.json or from
        # the pnpm-resolved (CI-tested) production versions.
        working-directory: functions
        run: pnpm run lockfile:check

      - name: Validate standalone Cloud Build npm install
        # The deploy uploads only functions/. npm 10 validates conditional
        # cross-major overrides differently from pnpm and npm 11; reproduce
        # that install before deploying, outside the pnpm workspace.
        env:
          FUNCTIONS_NPM_CHECK: ${{ runner.temp }}/functions-npm-check
        run: |
          mkdir -p "$FUNCTIONS_NPM_CHECK"
          cp functions/package.json functions/package-lock.json "$FUNCTIONS_NPM_CHECK/"
          npx --yes npm@10.9.9 ci --prefix "$FUNCTIONS_NPM_CHECK" --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Lint
        working-directory: functions
        run: pnpm run lint

      - name: Type check
        working-directory: functions
        run: pnpm run typecheck

      - name: Unit tests
        working-directory: functions
        run: pnpm run test

      - name: Build
        working-directory: functions
        run: pnpm run build
