name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-hosting:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-hosting-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure WIF secrets are configured
        # Fail loudly with the actual cause — google-github-actions/auth's own
        # error ("must specify exactly one of ...") reads like a workflow bug
        # when the real problem is the missing one-time WIF provisioning.
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::WIF_PROVIDER / WIF_SERVICE_ACCOUNT are not set in the 'production' environment. Run scripts/setup-wif.sh (one-time GCP provisioning) and store both secrets — see docs/deployment.md."
            exit 1
          fi
          # The WIF provider only exchanges tokens for refs/heads/main
          # (scripts/setup-wif.sh attribute condition) — a workflow_dispatch
          # from any other ref would fail at auth with an opaque permissions
          # error, so mirror that restriction here.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys only run from main (WIF token exchange is restricted to refs/heads/main); got $GITHUB_REF."
            exit 1
          fi

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install pnpm dependencies (for firebase-tools)
        working-directory: functions
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: npm run build --workspace @carcommunity/shared

      - name: Build admin web
        # Vite bakes these VITE_* values into the client bundle at build time,
        # so the deployed admin app boots with the real Firebase project config.
        # They are non-secret client identifiers (public in the shipped bundle),
        # so they live as `production` ENVIRONMENT VARIABLES (vars.*), not
        # secrets. The job's `environment: production` makes them resolve here;
        # the PR-only validate-admin-web build has no environment and builds
        # without them (it never needs the real project). Real protection stays
        # Security Rules + Auth + App Check + the Browser-key referrer allowlist.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          # reCAPTCHA Enterprise site key for App Check. REQUIRED in production:
          # every callable enforces App Check (enforceAppCheck, docs/app-check.md),
          # so a bundle built WITHOUT this key sends no App Check token and every
          # admin mutation — grant/revoke subscription, suspend, points, etc. — is
          # rejected by the callable framework with `unauthenticated` (direct
          # Firestore reads still work while console enforcement is monitor-only,
          # which is why lookups succeed but writes fail). The site key is a public
          # client identifier (baked into the bundle), so it lives as a `vars.*`
          # production ENVIRONMENT VARIABLE like the Firebase config above.
          VITE_APPCHECK_SITE_KEY: ${{ vars.VITE_APPCHECK_SITE_KEY }}
          # Public Mapbox access token (pk.…) enabling the map location picker's
          # Mapbox Standard view (mapbox://styles/mapbox/standard) — the SAME
          # style the member Android app renders. Deliberately REUSES the app's
          # existing MAPBOX_ACCESS_TOKEN — the runtime PUBLIC pk. token (see
          # build-android-release.yml: "the RUNTIME token (public map tiles)"),
          # NOT the private MAPBOX_DOWNLOADS_TOKEN (sk.). Reusing it means the
          # operator sets nothing new. Injecting a secrets.* value into a client
          # bundle is normally an anti-pattern, but is safe HERE because a pk.
          # token is public-by-design and already ships in the Android client;
          # it grants map-tile rendering only (no data/account access).
          # OPTIONAL and deliberately NOT in the required-vars loop below: an
          # empty value degrades the picker to manual lat/lng entry
          # (getMapboxToken() → '' → graceful fallback) and must never block a
          # deploy. Operator note: a harvested pk. token bills map loads to this
          # account — set a Mapbox spending cap and, ideally, referrer-restrict.
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          # Fail loudly if any value is missing — better than deploying a
          # bundle that throws "Missing required environment variable" on load,
          # or (for the App Check key) one whose admin mutations all 401.
          missing=""
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
                   VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
                   VITE_APPCHECK_SITE_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing production environment variable(s):$missing — set them under Settings → Environments → production → Variables. VITE_APPCHECK_SITE_KEY is the reCAPTCHA Enterprise site key: first register the admin hosting domain under reCAPTCHA Enterprise in the Firebase App Check console (docs/app-check.md), then store the resulting site key as this variable — without it every admin callable is rejected with 'unauthenticated'."
            exit 1
          fi
          npm run build --workspace apps/admin

      - name: Deploy Firebase Hosting
        # Run from the repo root so firebase-tools auto-discovers ./firebase.json.
        run: ./functions/node_modules/.bin/firebase deploy --only hosting --project kungsbacka-car-community --non-interactive
