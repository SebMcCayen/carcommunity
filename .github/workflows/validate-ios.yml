name: Validate iOS

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'contracts/localization/**'
      - 'contracts/design-tokens/**'
      - '.github/workflows/validate-ios.yml'
  # Intentionally no `branches:` filter: every PR runs CI regardless of its
  # base branch, so stacked PRs (base = another feature branch) are verified
  # too. A branch allowlist silently skips CI for any new naming scheme.
  # The `paths:` filter below still scopes this to relevant changes.
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'contracts/localization/**'
      - 'contracts/design-tokens/**'
      - '.github/workflows/validate-ios.yml'

permissions:
  contents: read

concurrency:
  group: validate-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ios:
    name: validate-ios
    # macOS minutes bill at a 10x multiplier on private repos — this job is
    # paths-filtered above so it only runs when iOS or its contracts change.
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js (for codegen checks)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify generated String Catalog is up to date
        run: |
          node apps/ios/scripts/generate-strings.mjs
          if ! git diff --exit-code apps/ios/KCC/Resources/Localizable.xcstrings; then
            echo "::error::Localizable.xcstrings is out of date. Run: node apps/ios/scripts/generate-strings.mjs"
            exit 1
          fi

      - name: Verify generated design tokens are up to date
        run: |
          node apps/ios/scripts/generate-tokens.mjs
          if ! git diff --exit-code apps/ios/KCC/Design/Tokens.swift; then
            echo "::error::Tokens.swift is out of date. Run: node apps/ios/scripts/generate-tokens.mjs"
            exit 1
          fi

      - name: Validate release metadata and preflight regression tests
        run: |
          python3 apps/ios/scripts/release-preflight.py
          python3 -m unittest discover -s apps/ios/scripts -p 'test_*.py'

      - name: Show Xcode version
        run: xcodebuild -version

      # Builds WITHOUT GoogleService-Info.plist (it is gitignored and no
      # secret is injected here) — this is deliberate: it continuously proves
      # the config-less-build seam that FirebaseBootstrap provides.
      - name: Build and test (unit + UI smoke tests, simulator, config-less)
        run: |
          cd apps/ios
          # Pick the first available iPhone simulator on the runner image, so
          # the workflow survives device-lineup renames across Xcode versions.
          DEST=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [0-9][^(]*' | sed 's/ *$//')
          echo "Using simulator destination: ${DEST}"
          xcodebuild -project KCC.xcodeproj -scheme KCC \
            -destination "platform=iOS Simulator,name=${DEST}" \
            -parallel-testing-enabled NO \
            -resultBundlePath "${RUNNER_TEMP}/ios-tests.xcresult" \
            test

      # TestFlight uses the Release configuration on arm64 hardware. Keep this
      # unsigned and config-less so PRs catch device-only compile/link failures
      # without storing Apple signing credentials or Firebase config in CI.
      - name: Build release for a generic iOS device (unsigned, config-less)
        run: |
          cd apps/ios
          xcodebuild -project KCC.xcodeproj -scheme KCC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
