name: Validate iOS

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'scripts/github_release_asset.py'
      - 'scripts/test_release_caches.py'
      - 'firebase/firestore.rules'
      - 'apps/admin/**'
      - 'firebase/firestore.indexes.json'
      - 'contracts/localization/**'
      - 'contracts/design-tokens/**'
      - '.github/workflows/validate-ios.yml'
  # Intentionally no `branches:` filter: every PR runs CI regardless of its
  # base branch, so stacked PRs (base = another feature branch) are verified
  # too. A branch allowlist silently skips CI for any new naming scheme.
  # The `paths:` filter below still scopes this to relevant changes.
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'scripts/github_release_asset.py'
      - 'scripts/test_release_caches.py'
      - 'firebase/firestore.rules'
      - 'apps/admin/**'
      - 'firebase/firestore.indexes.json'
      - 'contracts/localization/**'
      - 'contracts/design-tokens/**'
      - '.github/workflows/validate-ios.yml'

permissions:
  contents: read

concurrency:
  group: validate-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # Available on both standard images; the verified ARM allocation uses this same SDK.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

# Compile ARM Debug once for Community/full UI, with a separate cached Intel
# Debug producer for native SDK emulator compatibility. Optimized Release is separate.
# Product artifacts match the exact checkout and preserve executable/symlink modes.
# Save packages and bounded content-addressed compilations before running tests.
# Every original native test/build remains required; no cache supplies a test result.
jobs:
  # Validate source once before scheduling native builds; these checks also run on Linux locally.
  ios-preflight:
    name: iOS source preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js (for codegen checks)
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify generated String Catalog is up to date
        run: |
          node apps/ios/scripts/generate-strings.mjs
          if ! git diff --exit-code apps/ios/KCC/Resources/Localizable.xcstrings; then
            echo "::error::Localizable.xcstrings is out of date. Run: node apps/ios/scripts/generate-strings.mjs"
            exit 1
          fi
      - name: Verify generated design tokens are up to date
        run: |
          node apps/ios/scripts/generate-tokens.mjs
          if ! git diff --exit-code apps/ios/KCC/Design/Tokens.swift; then
            echo "::error::Tokens.swift is out of date. Run: node apps/ios/scripts/generate-tokens.mjs"
            exit 1
          fi
      - name: Validate release metadata and preflight regression tests
        run: |
          python3 apps/ios/scripts/release-preflight.py
          python3 -m unittest discover -s apps/ios/scripts -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_release_caches.py'
  ios-build-debug:
    name: iOS Debug build for testing
    needs: ios-preflight
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.products.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python for test-product transfer
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Finish Simulator runtime cache preparation
        timeout-minutes: 15
        run: xcrun simctl runtime dyld_shared_cache update --all
      - name: Identify toolchain, SDK, lockfile and destination
        id: context
        run: python3 apps/ios/scripts/ci-test-products.py context --kind debug
      - name: Restore resolved Swift packages
        id: packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ios-tests/SourcePackages
          key: ios-spm-v1-${{ steps.context.outputs.cache }}
      - name: Restore content-addressed compilations
        id: compilations
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ios-compilation-cache
          key: ios-cas-v1-${{ steps.context.outputs.cache }}-debug-${{ github.sha }}
          restore-keys: |
            ios-cas-v1-${{ steps.context.outputs.cache }}-debug-
      - name: Regenerate native project including feature folders
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd apps/ios
          xcodegen generate
      - name: Prepare verified Turf binary cache
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 apps/ios/scripts/prepare-turf-cache.py
      - name: Resolve the committed package graph
        timeout-minutes: 35
        run: |
          xcodebuild -resolvePackageDependencies \
            -project apps/ios/KCC.xcodeproj -scheme KCC \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests"
          git diff --exit-code -- apps/ios/KCC.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Save resolved Swift packages before compilation
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ios-tests/SourcePackages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Build Debug app and complete test targets
        timeout-minutes: 120
        run: |
          xcodebuild -project apps/ios/KCC.xcodeproj -scheme KCC \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.context.outputs.destination }}' \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests" \
            ENTITLEMENTS_REQUIRED=YES ONLY_ACTIVE_ARCH=YES \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="${RUNNER_TEMP}/ios-compilation-cache" \
            COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES COMPILATION_CACHE_LIMIT_SIZE=2G \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            -resultBundlePath "${RUNNER_TEMP}/ios-build-debug.xcresult" \
            build-for-testing
      - name: Verify compilation cache contains reusable output
        run: |
          python3 - <<'CACHE'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ios-compilation-cache"
          size = 0
          for path in root.rglob("*"):
              try:
                  if path.is_file():
                      size += path.stat().st_size
              except FileNotFoundError:
                  pass
          if size == 0:
              raise SystemExit("Enabled compilation cache produced no persisted data")
          print(f"Persisted compilation-cache data: {size} bytes")
          CACHE
      - name: Save completed compilations before executing tests
        if: steps.compilations.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ios-compilation-cache
          key: ${{ steps.compilations.outputs.cache-primary-key }}
      - name: Package exact-commit executable test products
        run: |
          python3 apps/ios/scripts/ci-test-products.py pack --kind debug \
            --products "${RUNNER_TEMP}/ios-tests/Build/Products" \
            --archive-directory "${RUNNER_TEMP}/ios-products" \
            --runtime '${{ steps.context.outputs.runtime }}'
      - name: Publish reusable test products
        id: products
        uses: actions/upload-artifact@v7
        with:
          name: ios-debug-test-products-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-products
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve build failure results
        if: failure() || vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-debug-build-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-build-debug.xcresult
          if-no-files-found: ignore
          retention-days: 3
  # Keep the native Firestore acceptance on the proven Intel Simulator transport.
  # Its architecture-aware package/compilation caches stay separate from ARM builds.
  ios-build-native:
    name: iOS native SDK build for testing
    needs: ios-preflight
    runs-on: macos-26-intel
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.products.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python for test-product transfer
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Finish Simulator runtime cache preparation
        timeout-minutes: 15
        run: xcrun simctl runtime dyld_shared_cache update --all
      - name: Identify toolchain, SDK, lockfile and destination
        id: context
        run: python3 apps/ios/scripts/ci-test-products.py context --kind debug
      - name: Restore resolved Swift packages
        id: packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ios-tests/SourcePackages
          key: ios-spm-v1-${{ steps.context.outputs.cache }}
      - name: Restore content-addressed compilations
        id: compilations
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ios-compilation-cache
          key: ios-cas-v1-${{ steps.context.outputs.cache }}-debug-${{ github.sha }}
          restore-keys: |
            ios-cas-v1-${{ steps.context.outputs.cache }}-debug-
      - name: Regenerate native project including feature folders
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd apps/ios
          xcodegen generate
      - name: Prepare verified Turf binary cache
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 apps/ios/scripts/prepare-turf-cache.py
      - name: Resolve the committed package graph
        timeout-minutes: 35
        run: |
          xcodebuild -resolvePackageDependencies \
            -project apps/ios/KCC.xcodeproj -scheme KCC \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests"
          git diff --exit-code -- apps/ios/KCC.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Save resolved Swift packages before compilation
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ios-tests/SourcePackages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Build Debug app and complete test targets
        timeout-minutes: 120
        run: |
          xcodebuild -project apps/ios/KCC.xcodeproj -scheme KCC \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.context.outputs.destination }}' \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests" \
            ENTITLEMENTS_REQUIRED=YES ONLY_ACTIVE_ARCH=YES \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="${RUNNER_TEMP}/ios-compilation-cache" \
            COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES COMPILATION_CACHE_LIMIT_SIZE=2G \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            -resultBundlePath "${RUNNER_TEMP}/ios-build-native.xcresult" \
            build-for-testing
      - name: Verify compilation cache contains reusable output
        run: |
          python3 - <<'CACHE'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ios-compilation-cache"
          size = 0
          for path in root.rglob("*"):
              try:
                  if path.is_file():
                      size += path.stat().st_size
              except FileNotFoundError:
                  pass
          if size == 0:
              raise SystemExit("Enabled compilation cache produced no persisted data")
          print(f"Persisted compilation-cache data: {size} bytes")
          CACHE
      - name: Save completed compilations before executing tests
        if: steps.compilations.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ios-compilation-cache
          key: ${{ steps.compilations.outputs.cache-primary-key }}
      - name: Package exact-commit executable test products
        run: |
          python3 apps/ios/scripts/ci-test-products.py pack --kind debug \
            --products "${RUNNER_TEMP}/ios-tests/Build/Products" \
            --archive-directory "${RUNNER_TEMP}/ios-products" \
            --runtime '${{ steps.context.outputs.runtime }}'
      - name: Publish reusable test products
        id: products
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-test-products-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-products
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve build failure results
        if: failure() || vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-build-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-build-native.xcresult
          if-no-files-found: ignore
          retention-days: 3
  ios-build-release:
    name: iOS optimized Release build for testing
    needs: ios-preflight
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.products.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python for test-product transfer
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Finish Simulator runtime cache preparation
        timeout-minutes: 15
        run: xcrun simctl runtime dyld_shared_cache update --all
      - name: Identify toolchain, SDK, lockfile and destination
        id: context
        run: python3 apps/ios/scripts/ci-test-products.py context --kind release
      - name: Restore resolved Swift packages
        id: packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ios-tests/SourcePackages
          key: ios-spm-v1-${{ steps.context.outputs.cache }}
      - name: Restore content-addressed compilations
        id: compilations
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ios-compilation-cache
          key: ios-cas-v1-${{ steps.context.outputs.cache }}-release-${{ github.sha }}
          restore-keys: |
            ios-cas-v1-${{ steps.context.outputs.cache }}-release-
      - name: Regenerate native project including feature folders
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd apps/ios
          xcodegen generate
      - name: Prepare verified Turf binary cache
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 apps/ios/scripts/prepare-turf-cache.py
      - name: Resolve the committed package graph
        timeout-minutes: 35
        run: |
          xcodebuild -resolvePackageDependencies \
            -project apps/ios/KCC.xcodeproj -scheme KCCReleaseSmoke \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests"
          git diff --exit-code -- apps/ios/KCC.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Save resolved Swift packages before compilation
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ios-tests/SourcePackages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Build optimized Release app and complete test targets
        timeout-minutes: 120
        run: |
          xcodebuild -project apps/ios/KCC.xcodeproj -scheme KCCReleaseSmoke \
            -configuration Release \
            -destination 'platform=iOS Simulator,id=${{ steps.context.outputs.destination }}' \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests" \
            ENTITLEMENTS_REQUIRED=YES ONLY_ACTIVE_ARCH=YES \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="${RUNNER_TEMP}/ios-compilation-cache" \
            COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES COMPILATION_CACHE_LIMIT_SIZE=2G \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            SWIFT_ENABLE_OPAQUE_TYPE_ERASURE=NO \
            -resultBundlePath "${RUNNER_TEMP}/ios-build-release.xcresult" \
            build-for-testing
      - name: Verify compilation cache contains reusable output
        run: |
          python3 - <<'CACHE'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ios-compilation-cache"
          size = 0
          for path in root.rglob("*"):
              try:
                  if path.is_file():
                      size += path.stat().st_size
              except FileNotFoundError:
                  pass
          if size == 0:
              raise SystemExit("Enabled compilation cache produced no persisted data")
          print(f"Persisted compilation-cache data: {size} bytes")
          CACHE
      - name: Save completed compilations before executing tests
        if: steps.compilations.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ios-compilation-cache
          key: ${{ steps.compilations.outputs.cache-primary-key }}
      - name: Package exact-commit executable test products
        run: |
          python3 apps/ios/scripts/ci-test-products.py pack --kind release \
            --products "${RUNNER_TEMP}/ios-tests/Build/Products" \
            --archive-directory "${RUNNER_TEMP}/ios-products" \
            --runtime '${{ steps.context.outputs.runtime }}'
      - name: Publish reusable test products
        id: products
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-test-products-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-products
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve build failure results
        if: failure() || vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-build-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-build-release.xcresult
          if-no-files-found: ignore
          retention-days: 3
  ios-community-ui:
    name: iOS Community (${{ matrix.label }})
    needs: ios-build-debug
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: shell
            test: testChatChromeAndRecoveryRemainReadableAtAccessibilityXXXL
          - label: keyboard
            test: testCommunityComposerStaysVisibleWithKeyboard
          - label: expansion
            test: testCommunitySpamSeriesExpandsWithoutHidingTheNewestMessage
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python for test-product transfer
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Finish Simulator runtime cache preparation
        timeout-minutes: 15
        run: xcrun simctl runtime dyld_shared_cache update --all
      - name: Download successful same-commit test build
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.ios-build-debug.outputs.artifact_id }}
          path: ${{ runner.temp }}/ios-products
          merge-multiple: true
      - name: Verify and restore app, runners and unfiltered test plan
        id: prepared
        run: |
          python3 apps/ios/scripts/ci-test-products.py unpack --kind debug \
            --archive-directory "${RUNNER_TEMP}/ios-products" \
            --products "${RUNNER_TEMP}/ios-tests/Build/Products"
      - name: Prepare software keyboard and boot the selected runtime
        timeout-minutes: 10
        run: |
          python3 apps/ios/scripts/configure-simulator-input.py '${{ steps.prepared.outputs.destination }}'
          xcrun simctl bootstatus '${{ steps.prepared.outputs.destination }}' -b
      - name: Community composer, expansion and maximum-text shell acceptance
        timeout-minutes: 40
        run: |
          xcodebuild test-without-building \
            -xctestrun '${{ steps.prepared.outputs.xctestrun }}' \
            -destination 'platform=iOS Simulator,id=${{ steps.prepared.outputs.destination }}' \
            -parallel-testing-enabled NO \
            -only-testing:KCCUITests/ShellSmokeTests/${{ matrix.test }} \
            -resultBundlePath "${RUNNER_TEMP}/ios-chat-smoke.xcresult"
          python3 apps/ios/scripts/ci-test-products.py check-result \
            --results "${RUNNER_TEMP}/ios-chat-smoke.xcresult" --expected-tests 1
      - name: Export failure screenshots and structured summary
        if: failure()
        timeout-minutes: 6
        run: |
          python3 apps/ios/scripts/export-test-results.py \
            --results "${RUNNER_TEMP}/ios-chat-smoke.xcresult" \
            --output "${RUNNER_TEMP}/ios-failure-evidence"
      - name: Preserve test failure evidence and optional passing results
        if: failure() || vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-community-ui-${{ matrix.label }}-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-failure-evidence
            ${{ runner.temp }}/ios-chat-smoke.xcresult
          if-no-files-found: ignore
          retention-days: 3
  ios-simulator:
    name: iOS simulator (unit + UI)
    needs: [ios-build-debug, ios-community-ui]
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python for test-product transfer
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Finish Simulator runtime cache preparation
        timeout-minutes: 15
        run: xcrun simctl runtime dyld_shared_cache update --all
      - name: Download successful same-commit test build
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.ios-build-debug.outputs.artifact_id }}
          path: ${{ runner.temp }}/ios-products
          merge-multiple: true
      - name: Verify and restore app, runners and unfiltered test plan
        id: prepared
        run: |
          python3 apps/ios/scripts/ci-test-products.py unpack --kind debug \
            --archive-directory "${RUNNER_TEMP}/ios-products" \
            --products "${RUNNER_TEMP}/ios-tests/Build/Products"
      - name: Prepare software keyboard and boot the selected runtime
        timeout-minutes: 10
        run: |
          python3 apps/ios/scripts/configure-simulator-input.py '${{ steps.prepared.outputs.destination }}'
          xcrun simctl bootstatus '${{ steps.prepared.outputs.destination }}' -b
      - name: Execute the unfiltered full unit and UI suite
        timeout-minutes: 120
        run: |
          xcodebuild test-without-building \
            -xctestrun '${{ steps.prepared.outputs.xctestrun }}' \
            -destination 'platform=iOS Simulator,id=${{ steps.prepared.outputs.destination }}' \
            -parallel-testing-enabled NO \
            -resultBundlePath "${RUNNER_TEMP}/ios-tests.xcresult"
      - name: Verify built simulator identity and keychain entitlements
        run: |
          python3 apps/ios/scripts/simulator-package.py \
            "${RUNNER_TEMP}/ios-tests/Build/Products/Debug-iphonesimulator/KCC.app"
      - name: Export failure screenshots and structured summary
        if: failure()
        timeout-minutes: 6
        run: |
          python3 apps/ios/scripts/export-test-results.py \
            --results "${RUNNER_TEMP}/ios-tests.xcresult" \
            --output "${RUNNER_TEMP}/ios-failure-evidence"
      - name: Preserve test failure evidence and optional passing results
        if: failure() || vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-failure-evidence
            ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 3
  ios-release:
    name: iOS optimized Release
    needs: ios-build-release
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python for test-product transfer
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Finish Simulator runtime cache preparation
        timeout-minutes: 15
        run: xcrun simctl runtime dyld_shared_cache update --all
      - name: Download successful same-commit test build
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.ios-build-release.outputs.artifact_id }}
          path: ${{ runner.temp }}/ios-products
          merge-multiple: true
      - name: Verify and restore app, runners and unfiltered test plan
        id: prepared
        run: |
          python3 apps/ios/scripts/ci-test-products.py unpack --kind release \
            --archive-directory "${RUNNER_TEMP}/ios-products" \
            --products "${RUNNER_TEMP}/ios-tests/Build/Products"
      - name: Prepare software keyboard and boot the selected runtime
        timeout-minutes: 10
        run: |
          python3 apps/ios/scripts/configure-simulator-input.py '${{ steps.prepared.outputs.destination }}'
          xcrun simctl bootstatus '${{ steps.prepared.outputs.destination }}' -b
      - name: Execute optimized Release shell acceptance
        timeout-minutes: 30
        run: |
          xcodebuild test-without-building \
            -xctestrun '${{ steps.prepared.outputs.xctestrun }}' \
            -destination 'platform=iOS Simulator,id=${{ steps.prepared.outputs.destination }}' \
            -parallel-testing-enabled NO \
            -only-testing:KCCUITests/ShellSmokeTests/testMapBackdropRemainsVisibleAfterTabAndSettingsRoundTrip \
            -only-testing:KCCUITests/ShellSmokeTests/testMapToolsAppearOnRightAndWorkWithoutBackend \
            -resultBundlePath "${RUNNER_TEMP}/ios-release-smoke.xcresult"
          python3 apps/ios/scripts/ci-test-products.py check-result \
            --results "${RUNNER_TEMP}/ios-release-smoke.xcresult" --expected-tests 2
      - name: Export failure screenshots and structured summary
        if: failure()
        timeout-minutes: 6
        run: |
          python3 apps/ios/scripts/export-test-results.py \
            --results "${RUNNER_TEMP}/ios-release-smoke.xcresult" \
            --output "${RUNNER_TEMP}/ios-failure-evidence"
      - name: Preserve test failure evidence and optional passing results
        if: failure() || vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-failure-evidence
            ${{ runner.temp }}/ios-release-smoke.xcresult
          if-no-files-found: ignore
          retention-days: 3
  ios-native:
    name: iOS native Firebase SDK
    needs: ios-build-native
    runs-on: macos-26-intel
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python for test-product transfer
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Finish Simulator runtime cache preparation
        timeout-minutes: 15
        run: xcrun simctl runtime dyld_shared_cache update --all
      - name: Download successful same-commit test build
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.ios-build-native.outputs.artifact_id }}
          path: ${{ runner.temp }}/ios-products
          merge-multiple: true
      - name: Verify and restore app, runners and unfiltered test plan
        id: prepared
        run: |
          python3 apps/ios/scripts/ci-test-products.py unpack --kind debug \
            --archive-directory "${RUNNER_TEMP}/ios-products" \
            --products "${RUNNER_TEMP}/ios-tests/Build/Products"
      - name: Prepare software keyboard and boot the selected runtime
        timeout-minutes: 10
        run: |
          python3 apps/ios/scripts/configure-simulator-input.py '${{ steps.prepared.outputs.destination }}'
          xcrun simctl bootstatus '${{ steps.prepared.outputs.destination }}' -b
      - name: Setup Node.js for local member emulators
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup JDK for native member emulators
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build backend handlers for native SDK acceptance
        timeout-minutes: 15
        run: |
          npm ci --prefix functions --ignore-scripts
          npm --prefix functions run build
          node scripts/native-member-emulators.mjs prepare "${RUNNER_TEMP}/native-members"
      # Native CLI dependencies can need compilation on Intel runners. Keep
      # that separate from backend setup and emulator downloads so one shared
      # 15-minute budget cannot cancel otherwise healthy acceptance tests.
      - name: Install pinned Firebase CLI
        timeout-minutes: 20
        run: npm install --global firebase-tools@15.34.0
      - name: Prepare Firebase emulator binaries
        timeout-minutes: 10
        run: |
          firebase setup:emulators:firestore
          firebase setup:emulators:database
      - name: Execute native Firebase Auth and member-tools acceptance
        timeout-minutes: 30
        run: |
          FUNCTIONS_DISCOVERY_TIMEOUT=120 GCLOUD_PROJECT=demo-kcc-ios-ci node scripts/run-no-cloud.mjs -- firebase emulators:exec \
            --project demo-kcc-ios-ci --config "${RUNNER_TEMP}/native-members/firebase.json" \
            --only auth,firestore,functions,database --non-interactive \
            "node scripts/native-member-emulators.mjs seed && python3 apps/ios/scripts/auth-emulator-tests.py run --products '${RUNNER_TEMP}/ios-tests/Build/Products' --destination '${{ steps.prepared.outputs.destination }}' --member-tools"
      - name: Export failure screenshots and structured summary
        if: failure()
        timeout-minutes: 6
        run: |
          python3 apps/ios/scripts/export-test-results.py \
            --results "${RUNNER_TEMP}/ios-tests/Build/Products/auth-emulator-tests.xcresult" \
            --output "${RUNNER_TEMP}/ios-failure-evidence"
      - name: Preserve test failure evidence and optional passing results
        if: failure() || vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-failure-evidence
            ${{ runner.temp }}/ios-tests/Build/Products/auth-emulator-tests.xcresult
            *-debug.log
          if-no-files-found: ignore
          retention-days: 3
  # Independently compile unsigned arm64 Release for an iOS device. This does not claim physical-device runtime coverage.
  ios-device:
    name: iOS unsigned arm64 build
    needs: ios-preflight
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js (for codegen checks)
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Regenerate native project including feature folders
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd apps/ios
          xcodegen generate
      - name: Prepare verified Turf binary cache
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 apps/ios/scripts/prepare-turf-cache.py
      - name: Build release for a generic iOS device (unsigned, config-less)
        run: |
          cd apps/ios
          xcodebuild -project KCC.xcodeproj -scheme KCC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests" \
            CODE_SIGNING_ALLOWED=NO \
            build
  # A build/cache hit never supplies acceptance. Every execution gate must pass.
  validate-ios:
    name: validate-ios
    if: ${{ always() }}
    needs:
      - ios-preflight
      - ios-build-debug
      - ios-build-native
      - ios-community-ui
      - ios-simulator
      - ios-build-release
      - ios-release
      - ios-native
      - ios-device
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Require every iOS build and execution gate to succeed
        env:
          IOS_GATE_RESULTS: ${{ toJSON(needs) }}
        run: python3 apps/ios/scripts/ci-gate-results.py
