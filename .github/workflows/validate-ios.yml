name: Validate iOS

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'firebase/firestore.rules'
      - 'apps/admin/**'
      - 'firebase/firestore.indexes.json'
      - 'contracts/localization/**'
      - 'contracts/design-tokens/**'
      - '.github/workflows/validate-ios.yml'
  # Intentionally no `branches:` filter: every PR runs CI regardless of its
  # base branch, so stacked PRs (base = another feature branch) are verified
  # too. A branch allowlist silently skips CI for any new naming scheme.
  # The `paths:` filter below still scopes this to relevant changes.
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'firebase/firestore.rules'
      - 'apps/admin/**'
      - 'firebase/firestore.indexes.json'
      - 'contracts/localization/**'
      - 'contracts/design-tokens/**'
      - '.github/workflows/validate-ios.yml'

permissions:
  contents: read

concurrency:
  group: validate-ios-${{ github.ref }}
  cancel-in-progress: true

# The measured serial Intel run passed the full unit/UI and optimized Release
# gates, but consumed over three hours before native SDK/device acceptance.
# Run the four independent native gates concurrently on standard Intel runners.
# Each job keeps its checks; validate-ios requires every job to succeed.
# Simulator execution is x86_64; the unsigned device build targets arm64.
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners
jobs:
  # Validate source once before scheduling native builds; these checks also run on Linux locally.
  ios-preflight:
    name: iOS source preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js (for codegen checks)
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify generated String Catalog is up to date
        run: |
          node apps/ios/scripts/generate-strings.mjs
          if ! git diff --exit-code apps/ios/KCC/Resources/Localizable.xcstrings; then
            echo "::error::Localizable.xcstrings is out of date. Run: node apps/ios/scripts/generate-strings.mjs"
            exit 1
          fi
      - name: Verify generated design tokens are up to date
        run: |
          node apps/ios/scripts/generate-tokens.mjs
          if ! git diff --exit-code apps/ios/KCC/Design/Tokens.swift; then
            echo "::error::Tokens.swift is out of date. Run: node apps/ios/scripts/generate-tokens.mjs"
            exit 1
          fi
      - name: Validate release metadata and preflight regression tests
        run: |
          python3 apps/ios/scripts/release-preflight.py
          python3 -m unittest discover -s apps/ios/scripts -p 'test_*.py'
  # Keep the changed Community cases and the unfiltered full unit/UI suite together, including simulator identity and Keychain checks.
  ios-simulator:
    name: iOS simulator (unit + UI)
    needs: ios-preflight
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js (for codegen checks)
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Regenerate native project including feature folders
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd apps/ios
          xcodegen generate
      - name: Community composer and expansion acceptance (config-less)
        run: |
          DEST=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          print(next(device["udid"] for runtime in json.load(sys.stdin)["devices"].values()
                     for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone ")))
          ')
          xcrun simctl bootstatus "$DEST" -b
          xcodebuild -project apps/ios/KCC.xcodeproj -scheme KCCReleaseSmoke \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${DEST}" \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests" \
            ENTITLEMENTS_REQUIRED=YES ONLY_ACTIVE_ARCH=YES \
            -parallel-testing-enabled NO \
            -only-testing:KCCUITests/ShellSmokeTests/testCommunityComposerStaysVisibleWithKeyboard \
            -only-testing:KCCUITests/ShellSmokeTests/testCommunitySpamSeriesExpandsWithoutHidingTheNewestMessage \
            -resultBundlePath "${RUNNER_TEMP}/ios-chat-smoke.xcresult" \
            test
      - name: Build and test (unit + UI smoke tests, simulator, config-less)
        run: |
          cd apps/ios
          # Pick the first available iPhone simulator on the runner image, so
          # the workflow survives device-lineup renames across Xcode versions.
          # Use its UDID to avoid ambiguous names across installed runtimes.
          DEST=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime in devices.values() for device in runtime
                     if device.get("isAvailable") and device["name"].startswith("iPhone ")))
          ')
          echo "Using simulator destination: ${DEST}"
          # A cold first UI-test launch has timed out on hosted Xcode runners
          # while subsequent tests pass. Wait for simulator startup explicitly;
          # do not retry or suppress failing tests.
          xcrun simctl bootstatus "$DEST" -b
          xcodebuild -project KCC.xcodeproj -scheme KCC \
            -destination "platform=iOS Simulator,id=${DEST}" \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests" \
            ENTITLEMENTS_REQUIRED=YES \
            -parallel-testing-enabled NO \
            -resultBundlePath "${RUNNER_TEMP}/ios-tests.xcresult" \
            test
      - name: Verify built simulator identity and keychain entitlements
        run: |
          python3 apps/ios/scripts/simulator-package.py \
            "${RUNNER_TEMP}/ios-tests/Build/Products/Debug-iphonesimulator/KCC.app"
      - name: Export config-less simulator screenshot attachments
        if: always()
        run: |
          RESULTS="${RUNNER_TEMP}/ios-tests.xcresult"
          SCREENSHOTS="${RUNNER_TEMP}/ios-configless-screenshots"
          if [ ! -d "${RESULTS}" ]; then
            RESULTS="${RUNNER_TEMP}/ios-chat-smoke.xcresult"
          fi
          if [ -d "${RESULTS}" ]; then
            mkdir -p "${SCREENSHOTS}"
            xcrun xcresulttool export attachments \
              --path "${RESULTS}" \
              --output-path "${SCREENSHOTS}"
          fi
      - name: Upload simulator results and screenshot attachments
        if: always() && vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/ios-chat-smoke.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload config-less screenshot PNGs and attachment manifest
        if: always() && vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-configless-screenshots
          path: ${{ runner.temp }}/ios-configless-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload generated Xcode project
        if: always() && vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-generated-project
          path: apps/ios/KCC.xcodeproj
          if-no-files-found: ignore
          retention-days: 7
  # Run optimized SwiftUI without implicit view type erasure in a fresh, explicitly booted simulator.
  ios-release:
    name: iOS optimized Release
    needs: ios-preflight
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js (for codegen checks)
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Regenerate native project including feature folders
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd apps/ios
          xcodegen generate
      - name: Release shell smoke tests (optimized, config-less)
        run: |
          DEST=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          print(next(device["udid"] for runtime in json.load(sys.stdin)["devices"].values()
                     for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone ")))
          ')
          xcrun simctl bootstatus "$DEST" -b
          xcodebuild -project apps/ios/KCC.xcodeproj -scheme KCCReleaseSmoke \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${DEST}" \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests" \
            ENTITLEMENTS_REQUIRED=YES ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_OPAQUE_TYPE_ERASURE=NO \
            -parallel-testing-enabled NO \
            -only-testing:KCCUITests/ShellSmokeTests/testMapBackdropRemainsVisibleAfterTabAndSettingsRoundTrip \
            -only-testing:KCCUITests/ShellSmokeTests/testMapToolsAppearOnRightAndWorkWithoutBackend \
            -resultBundlePath "${RUNNER_TEMP}/ios-release-smoke.xcresult" \
            test
      - name: Export optimized Release screenshot attachments
        if: always()
        run: |
          RESULTS="${RUNNER_TEMP}/ios-release-smoke.xcresult"
          SCREENSHOTS="${RUNNER_TEMP}/ios-release-screenshots"
          if [ -d "${RESULTS}" ]; then
            mkdir -p "${SCREENSHOTS}"
            xcrun xcresulttool export attachments --path "${RESULTS}" --output-path "${SCREENSHOTS}"
          fi
      - name: Upload optimized Release results and screenshots
        if: always() && vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-test-results
          path: |
            ${{ runner.temp }}/ios-release-smoke.xcresult
            ${{ runner.temp }}/ios-release-screenshots
          if-no-files-found: ignore
          retention-days: 7
  # Exercise Firebase Auth and member tools against isolated local emulators, with no cloud credentials.
  ios-native:
    name: iOS native Firebase SDK
    needs: ios-preflight
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js (for codegen checks)
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Regenerate native project including feature folders
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd apps/ios
          xcodegen generate
      - name: Setup JDK for native member emulators
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build backend handlers for native SDK acceptance
        run: |
          npm ci --prefix functions --ignore-scripts
          npm --prefix functions run build
          node scripts/native-member-emulators.mjs prepare "${RUNNER_TEMP}/native-members"
          npm install --global firebase-tools@15.34.0
          firebase setup:emulators:firestore
          firebase setup:emulators:database
      - name: Native Firebase Auth and member-tools acceptance (no cloud credentials)
        run: |
          DEST=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          print(next(device["udid"] for runtime in json.load(sys.stdin)["devices"].values()
                     for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone ")))
          ')
          xcrun simctl bootstatus "$DEST" -b
          xcodebuild -project apps/ios/KCC.xcodeproj -scheme KCC \
            -destination "platform=iOS Simulator,id=${DEST}" \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests" \
            ENTITLEMENTS_REQUIRED=YES \
            -only-testing:KCCTests/FirebaseEmulatorIntegrationTests build-for-testing
          # firebase-tools also applies this limit to runtime socket readiness.
          # Slow worker imports must complete before the unchanged SDK checks.
          FUNCTIONS_DISCOVERY_TIMEOUT=120 GCLOUD_PROJECT=demo-kcc-ios-ci node scripts/run-no-cloud.mjs -- firebase emulators:exec \
            --project demo-kcc-ios-ci --config "${RUNNER_TEMP}/native-members/firebase.json" \
            --only auth,firestore,functions,database --non-interactive \
            "node scripts/native-member-emulators.mjs seed && python3 apps/ios/scripts/auth-emulator-tests.py run --products '${RUNNER_TEMP}/ios-tests/Build/Products' --destination '${DEST}' --member-tools"
      - name: Upload native Firebase acceptance results
        if: always() && vars.IOS_UPLOAD_TEST_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-sdk-results
          path: |
            ${{ runner.temp }}/ios-tests/Build/Products/auth-emulator-tests.xcresult
            *-debug.log
          if-no-files-found: ignore
          retention-days: 7
  # Independently compile unsigned arm64 Release for an iOS device. This does not claim physical-device runtime coverage.
  ios-device:
    name: iOS unsigned arm64 build
    needs: ios-preflight
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js (for codegen checks)
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Regenerate native project including feature folders
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd apps/ios
          xcodegen generate
      - name: Build release for a generic iOS device (unsigned, config-less)
        run: |
          cd apps/ios
          xcodebuild -project KCC.xcodeproj -scheme KCC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${RUNNER_TEMP}/ios-tests" \
            CODE_SIGNING_ALLOWED=NO \
            build
  # Keep the required check name stable. Failure, cancellation, skipping, or missing results in any gate must fail this check.
  validate-ios:
    name: validate-ios
    if: ${{ always() }}
    needs:
      - ios-preflight
      - ios-simulator
      - ios-release
      - ios-native
      - ios-device
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Require every iOS gate to succeed
        env:
          IOS_GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 apps/ios/scripts/ci-gate-results.py
