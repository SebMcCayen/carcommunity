name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # deny-licenses is deprecated (actions/dependency-review-action#997);
          # an allow-list of SPDX identifiers is the recommended replacement.
          allow-licenses: MIT, MIT-0, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, MPL-2.0, CC0-1.0, CC-BY-3.0, CC-BY-4.0, Unlicense, Python-2.0, Zlib
          comment-summary-in-pr: always
