name: Dependency Review

on:
  # Intentionally no `branches:` filter: every PR runs CI regardless of its
  # base branch, so stacked PRs (base = another feature branch) are verified
  # too. A branch allowlist silently skips CI for any new naming scheme.
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # deny-licenses is deprecated (actions/dependency-review-action#997);
          # an allow-list of SPDX identifiers is the recommended replacement.
          allow-licenses: MIT, MIT-0, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, MPL-2.0, CC0-1.0, CC-BY-3.0, CC-BY-4.0, Unlicense, Python-2.0, Zlib
          # Per-PACKAGE license exemption — scoped to `mapbox-gl` ONLY, NOT a
          # relaxation of `allow-licenses` above (which still rejects every other
          # non-permissive dependency).
          #
          # The admin map location picker (apps/admin) renders Mapbox GL JS
          # loading `mapbox://styles/mapbox/standard` so the admin map matches the
          # member Android app's view (Style.STANDARD) — Seb's explicit decision;
          # MapLibre cannot render the v3 Standard style. `mapbox-gl` ships under
          # the proprietary Mapbox Web SDK ToS (reported as
          # LicenseRef-bad-see-license-in-license.txt, and "unknown" from the
          # package.json manifest half), which is not an OSI/SPDX identifier and
          # so is not — and should not be — in `allow-licenses`. This PURL
          # exempts that single package by name; a hypothetical *other*
          # proprietary dependency would still fail the license gate.
          allow-dependencies-licenses: pkg:npm/mapbox-gl
          # ONE advisory, suppressed deliberately — not a relaxation of the gate.
          #
          # GHSA-qwww-vcr4-c8h2 (react-router, RSC-mode CSRF bypass, high).
          # Affected range >= 7.12.0 < 8.3.0; FIRST PATCHED VERSION IS 8.3.0, and
          # there is no fix anywhere on the 7.x line. `react-router-dom` has no
          # 8.x at all (v8 ships as `react-router`), so leaving it is a major
          # migration, not a version bump.
          #
          # Why suppressing is safer than holding: main ALREADY ships an affected
          # 7.x, and dependency-review only flags NEWLY INTRODUCED versions — so
          # standing still passes while every 7.x patch trips. That inverts the
          # gate: it blocks the releases that harden react-router (7.18.2 is
          # literally "Harden RSC CSRF codepaths") to keep us on one that doesn't.
          # A Dependabot ignore rule would be worse still, suppressing genuine
          # fixes too (7.18.0 closed two real advisories).
          #
          # Why it is not reachable here: the advisory applies only to apps using
          # the unstable RSC APIs. apps/admin is a client-only Vite SPA on static
          # hosting using <BrowserRouter> — no server runtime, no @react-router/*
          # server package, no RSC/loader/action endpoint.
          #
          # REMOVE THIS the moment apps/admin migrates to react-router >= 8.3.0.
          # Scoped to this single GHSA: every other high-severity advisory,
          # including any future react-router one, still fails the build.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
          comment-summary-in-pr: always
