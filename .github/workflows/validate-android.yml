name: Validate Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'contracts/localization/**'
      - 'contracts/design-tokens/**'
      - '.github/workflows/validate-android.yml'
  # Intentionally no `branches:` filter: every PR runs CI regardless of its
  # base branch, so stacked PRs (base = another feature branch) are verified
  # too. A branch allowlist silently skips CI for any new naming scheme.
  # The `paths:` filter below still scopes this to relevant changes.
  pull_request:
    paths:
      - 'apps/android/**'
      - 'contracts/localization/**'
      - 'contracts/design-tokens/**'
      - '.github/workflows/validate-android.yml'

permissions:
  contents: read

concurrency:
  group: validate-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-android:
    name: validate-android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js (for strings generation check)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify generated strings are up to date
        run: |
          node apps/android/scripts/generate-strings.mjs
          if ! git diff --exit-code apps/android/app/src/main/res/values/strings.xml apps/android/app/src/main/res/values-en/strings.xml; then
            echo "::error::Generated strings.xml files are out of date. Run: node apps/android/scripts/generate-strings.mjs"
            exit 1
          fi

      - name: Verify generated design tokens are up to date
        run: |
          node apps/android/scripts/generate-tokens.mjs
          if ! git diff --exit-code apps/android/app/src/main/java/com/kungsbackacarcommunity/app/design/Tokens.kt; then
            echo "::error::Generated Tokens.kt is out of date. Run: node apps/android/scripts/generate-tokens.mjs"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew --no-daemon test

      - name: Android Lint
        working-directory: apps/android
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  nav-variant-compile:
    name: nav-variant-compile (Mapbox Navigation SDK)
    runs-on: ubuntu-latest
    # WHY THIS JOB EXISTS
    # ------------------
    # `validate-android` above runs WITHOUT MAPBOX_DOWNLOADS_TOKEN, so
    # `navSdkEnabled` is false (app/build.gradle.kts) and the source-set swap
    # compiles the token-less stub `app/src/nav` -> `app/src/noNav`. Everything
    # under `app/src/nav/**` — the real Mapbox Navigation SDK v3 turn-by-turn
    # implementation — is therefore NOT on the compile path of any other job on
    # a PR or a push. Before this job, `src/nav` was compiled only by
    # `build-android-release.yml`, which is `workflow_dispatch`-only, i.e. a
    # compile error there could only be discovered while cutting a release.
    #
    # This job closes that gap: it supplies the token so the real `src/nav`
    # source set is selected, and compiles it. It is a COMPILE-ONLY gate — no
    # emulator, no signing, no release artifacts.
    #
    # SECRET SCOPE
    # ------------
    # MAPBOX_DOWNLOADS_TOKEN lives in the `production` environment (there is no
    # repo-level copy), so the job must opt into that environment to read it.
    # That grants the job read access to the rest of the production secrets for
    # its duration, which is why it is deliberately kept to checkout + Gradle
    # compile and references only the one token. If least privilege matters more
    # later, move MAPBOX_DOWNLOADS_TOKEN into a dedicated environment holding
    # nothing else and point `environment:` at that instead — no other change is
    # needed here.
    environment: production
    # GitHub does not expose secrets to `pull_request` runs from a FORK. Without
    # the token this job would silently compile the noNav stub and report green
    # while covering nothing, so it is skipped outright on fork PRs rather than
    # claiming coverage it does not have. Fork changes to `src/nav` are covered
    # only once merged (the `push: main` run of this workflow).
    #
    # The same hole exists for DEPENDABOT PRs, for a different reason. Dependabot
    # branches live in this repo (so the fork check above passes), but workflows
    # triggered by Dependabot read secrets from the separate *Dependabot secrets*
    # store — repository AND environment Actions secrets are not exposed to them.
    # `environment: production` therefore resolves MAPBOX_DOWNLOADS_TOKEN to an
    # empty string and the token gate below fails every time, so this job could
    # never pass on a dependency bump no matter how good the bump was (see the
    # actions/setup-node v5 -> v7 PR, where this job failed in 14s while the
    # `validate-android` job that actually uses setup-node passed). That is a red
    # check carrying no signal, on PRs that by definition cannot touch src/nav.
    # Skip it here for the same reason as forks — no token means no coverage, and
    # claiming coverage we do not have is worse than skipping. Dependabot PRs
    # cannot modify `apps/android/**` anyway; nav changes stay covered by the
    # `push: main` run. To restore coverage on bumps instead of skipping, add
    # MAPBOX_DOWNLOADS_TOKEN to the repo's Dependabot secrets and drop this
    # clause — nothing else here needs to change.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Require the Mapbox downloads token
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          # This job's entire value is compiling the nav source set. Without the
          # token Gradle would fall back to the noNav stub and pass green, so a
          # missing/removed secret must FAIL loudly instead of degrading into
          # false coverage. Never echo the token itself.
          if [ -z "${MAPBOX_DOWNLOADS_TOKEN:-}" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN is not available to this job, so app/src/nav cannot be compiled. Set it as a secret in the 'production' environment."
            exit 1
          fi
          echo "MAPBOX_DOWNLOADS_TOKEN is present."

      - name: Compile the nav-enabled variant (app/src/nav)
        working-directory: apps/android
        env:
          ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Assert the nav source set was actually compiled
        run: |
          set -euo pipefail
          # Guard against false-green: `compileDebugKotlin` succeeds for BOTH
          # source sets, so a broken token would produce a passing noNav build.
          # BuildConfig.NAV_SDK_ENABLED is generated from the SAME `navSdkEnabled`
          # value that drives the src/nav vs src/noNav swap, so asserting it is
          # true proves the real nav code was on the compile path.
          BUILD_CONFIG="$(find apps/android/app/build/generated -name BuildConfig.java -path '*debug*' | head -n1)"
          if [ -z "$BUILD_CONFIG" ]; then
            echo "::error::Generated debug BuildConfig.java not found — cannot verify which source set was compiled."
            exit 1
          fi
          if ! grep -q 'NAV_SDK_ENABLED = true' "$BUILD_CONFIG"; then
            echo "::error::NAV_SDK_ENABLED is not true — the token-less src/noNav stub was compiled, so app/src/nav was NOT type-checked by this job."
            grep -n 'NAV_SDK_ENABLED' "$BUILD_CONFIG" || true
            exit 1
          fi
          echo "NAV_SDK_ENABLED = true — app/src/nav was compiled."

  instrumented-tests:
    name: instrumented-tests (Compose UI)
    runs-on: ubuntu-latest
    # Phase 17: Compose UI tests on an emulator. Emulator CI is
    # environment-sensitive (KVM, boot, Compose timing) and cannot be
    # validated outside GitHub Actions, so this job is INFORMATIONAL
    # (non-blocking) until it has a proven track record — it still runs
    # and surfaces results, but does not gate the PR. Promote to required
    # once green across several runs.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      # ROOT-CAUSE FIX for the intermittent "Unable to connect to adb daemon on
      # port: 5037" → "Failed to start Emulator console" flake: the job used to
      # COLD-boot a full API-34 system image every run (-no-snapshot + fresh
      # image install), and that cold boot occasionally never became adb-ready.
      # Now we (1) boot the CI-optimised google_atd image (Automated Test Device,
      # WITH Google APIs the app needs — Firebase/Maps — but far lighter/faster to
      # boot than the full image), and (2) cache the AVD + a warm snapshot so runs
      # boot from a known-good snapshot instead of cold. Actions cache is FREE
      # (10 GB, auto-evicting) and separate from the artifact-storage quota.
      # Cache ONLY the AVD dir (the snapshot lives here) — deliberately NOT
      # ~/.android/adb* which matches the private `adbkey`; the emulator gets its
      # adb pubkey injected at boot (androidboot.qemu.adb.pubkey), so the key does
      # not need caching, and keeping a private key out of the cache avoids any
      # blast-radius if a cache is restored in an untrusted context.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
          key: avd-google_atd-34-x86_64-v2

      # On a cache miss, create the AVD once and boot it to generate the snapshot
      # the cache stores. Skipped entirely on a cache hit.
      - name: Create AVD + snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "AVD snapshot generated for caching."

      # Run the tests, booting from the cached snapshot (-no-snapshot-save loads
      # it without re-saving). Two attempts as a backstop: attempt 1 is
      # continue-on-error so a rare boot flake doesn't fail the job; the retry
      # runs only if it failed, and the retry's outcome gates the job (both must
      # fail for a real red).
      - name: Run Compose UI tests on emulator (attempt 1)
        id: emulator_attempt_1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Run Compose UI tests on emulator (retry)
        if: steps.emulator_attempt_1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumentation results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connected-test-reports
          path: apps/android/app/build/reports/androidTests/
          retention-days: 14
