name: Validate Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'contracts/localization/**'
      - 'contracts/design-tokens/**'
      - '.github/workflows/validate-android.yml'
  pull_request:
    # phase-* lets CI run on stacked PRs (base = previous phase branch),
    # not only on PRs targeting main.
    branches: [main, 'phase-*']
    paths:
      - 'apps/android/**'
      - 'contracts/localization/**'
      - 'contracts/design-tokens/**'
      - '.github/workflows/validate-android.yml'

permissions:
  contents: read

concurrency:
  group: validate-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-android:
    name: validate-android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js (for strings generation check)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify generated strings are up to date
        run: |
          node apps/android/scripts/generate-strings.mjs
          if ! git diff --exit-code apps/android/app/src/main/res/values/strings.xml apps/android/app/src/main/res/values-en/strings.xml; then
            echo "::error::Generated strings.xml files are out of date. Run: node apps/android/scripts/generate-strings.mjs"
            exit 1
          fi

      - name: Verify generated design tokens are up to date
        run: |
          node apps/android/scripts/generate-tokens.mjs
          if ! git diff --exit-code apps/android/app/src/main/java/com/kungsbackacarcommunity/app/design/Tokens.kt; then
            echo "::error::Generated Tokens.kt is out of date. Run: node apps/android/scripts/generate-tokens.mjs"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew --no-daemon test

      - name: Android Lint
        working-directory: apps/android
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  instrumented-tests:
    name: instrumented-tests (Compose UI)
    runs-on: ubuntu-latest
    # Phase 17: Compose UI tests on an emulator. Emulator CI is
    # environment-sensitive (KVM, boot, Compose timing) and cannot be
    # validated outside GitHub Actions, so this job is INFORMATIONAL
    # (non-blocking) until it has a proven track record — it still runs
    # and surfaces results, but does not gate the PR. Promote to required
    # once green across several runs.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Compose UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: apps/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumentation results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: apps/android/app/build/reports/androidTests/
          retention-days: 14
