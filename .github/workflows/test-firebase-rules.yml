name: Test Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - 'firebase/firestore.rules'
      - 'firebase/database.rules.json'
      - 'firebase/storage.rules'
      - 'firebase/firestore.indexes.json'
      - 'firebase.json'
      - 'functions/src/**/*.emulator.test.ts'
      - 'functions/vitest.emulator.config.ts'
      - '.github/workflows/test-firebase-rules.yml'
  # Intentionally no `branches:` filter: every PR runs CI regardless of its
  # base branch, so stacked PRs (base = another feature branch) are verified
  # too. A branch allowlist silently skips CI for any new naming scheme.
  # The `paths:` filter below still scopes this to relevant changes.
  pull_request:
    paths:
      - 'firebase/firestore.rules'
      - 'firebase/database.rules.json'
      - 'firebase/storage.rules'
      - 'firebase/firestore.indexes.json'
      - 'firebase.json'
      - 'functions/src/**/*.emulator.test.ts'
      - 'functions/vitest.emulator.config.ts'
      - '.github/workflows/test-firebase-rules.yml'

permissions:
  contents: read

jobs:
  test-firebase-rules:
    name: test-firebase-rules
    runs-on: ubuntu-latest
    # The emulator suite normally runs ~10-12 min. Cap the job so a mid-suite
    # freeze (the process going silent and hanging) dies fast instead of
    # burning the 6h default — one such hang once ran 62 min before it was
    # killed. This is the fail-fast guard; the teardown/exit-code robustness
    # lives in functions/scripts/run-emulator-tests.mjs.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('functions/package.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install dependencies
        working-directory: functions
        run: pnpm install --frozen-lockfile

      - name: Run emulator integration tests
        working-directory: functions
        # Cold-starting ~160 function definitions under CI load can exceed the
        # functions emulator's default 30s discovery timeout, surfacing as an
        # intermittent "Failed to load function" (e.g. admin-setFeatureFlag /
        # feedback-reportIssue) that flakes the whole suite. Give it headroom.
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: "120"
        run: pnpm run emulators:test
