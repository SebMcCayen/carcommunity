name: Android system bars

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/validate-android-system-bars.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-system-bars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modern-system-bars:
    name: System bars (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.1
      # Compile before boot so Kotlin and the emulator don't compete for RAM.
      # No google-services.json, publishing credentials or production data.
      - name: Build disposable app and test APKs
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test themes, cutout, map controls and real keyboard in both navigation modes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          # Keep test userdata within hosted-runner disk capacity.
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/android
          script: bash scripts/test-system-bars.sh
      - name: Retain screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-bars-api-${{ matrix.api }}
          path: system-bars-evidence/
          if-no-files-found: warn
          retention-days: 14
