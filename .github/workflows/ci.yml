name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: API prisma generate
        run: npm --workspace services/api run prisma:generate

      - name: Build shared package
        run: npm --workspace @carcommunity/shared run build

      - name: Root lint
        run: npm run lint

      - name: Root typecheck
        run: npm run typecheck

      - name: Root test
        run: npm test

      - name: Root build
        run: npm run build

      - name: API lint
        run: npm --workspace services/api run lint

      - name: API typecheck
        run: npm --workspace services/api run typecheck

      - name: API test
        run: npm --workspace services/api test

      - name: API build
        run: npm --workspace services/api run build

      - name: Mobile lint
        run: npm --workspace apps/mobile run lint

      - name: Mobile typecheck
        run: npm --workspace apps/mobile run typecheck

      - name: Mobile test
        run: npm --workspace apps/mobile test

      - name: Mobile build
        run: npm --workspace apps/mobile run build

      - name: Admin lint
        run: npm --workspace apps/admin run lint

      - name: Admin typecheck
        run: npm --workspace apps/admin run typecheck

      - name: Admin test
        run: npm --workspace apps/admin test

      - name: Admin build
        run: npm --workspace apps/admin run build

  contracts:
    name: Validate contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JSON Schema tools
        run: npm install --no-save --no-audit --no-fund ajv-cli@5 ajv-formats@3

      - name: Compile common schema
        run: npx ajv compile --spec=draft2020 -c ajv-formats -s contracts/schemas/common.schema.json

      - name: Compile domain schemas
        run: |
          npx ajv compile --spec=draft2020 -c ajv-formats \
            -r contracts/schemas/common.schema.json \
            -s contracts/schemas/auth.schema.json \
            -s contracts/schemas/user-profile.schema.json \
            -s contracts/schemas/live-location.schema.json \
            -s contracts/schemas/events.schema.json

      - name: Validate error codes registry
        run: |
          npx ajv validate --spec=draft2020 -c ajv-formats \
            -s contracts/errors/errors.schema.json \
            -d contracts/errors/errors.json

      - name: Validate callable function registry
        run: |
          npx ajv validate --spec=draft2020 -c ajv-formats \
            -s contracts/functions/functions.schema.json \
            -d contracts/functions/functions.json

      - name: Validate feature flag registry
        run: |
          npx ajv validate --spec=draft2020 -c ajv-formats \
            -s contracts/features/feature-flags.schema.json \
            -d contracts/features/feature-flags.json

      - name: Validate design token registry
        run: |
          npx ajv validate --spec=draft2020 -c ajv-formats \
            -s contracts/design-tokens/tokens.schema.json \
            -d contracts/design-tokens/tokens.json

      - name: Check localization key parity (sv vs en)
        run: |
          diff <(jq -r 'paths(scalars) | join(".")' contracts/localization/sv.json | sort) \
               <(jq -r 'paths(scalars) | join(".")' contracts/localization/en.json | sort)

      - name: Check localization values are non-empty strings
        run: |
          fail=0
          for f in contracts/localization/sv.json contracts/localization/en.json; do
            bad=$(jq -r '
              [paths(scalars) as $p | select((getpath($p) | type != "string") or (getpath($p) == "")) | ($p | join("."))]
              + [paths(arrays) as $p | ($p | join(".")) + " (array not allowed)"]
              + [paths(objects) as $p | select(getpath($p) == {}) | ($p | join(".")) + " (empty object)"]
              | .[]' "$f")
            if [ -n "$bad" ]; then
              echo "Invalid leaf values in $f:"
              echo "$bad"
              fail=1
            fi
          done
          exit $fail

      - name: Check registry keys are unique
        run: |
          fail=0
          check() {
            dupes=$(jq -r "$2" "$1" | sort | uniq -d)
            if [ -n "$dupes" ]; then
              echo "Duplicate entries in $1:"
              echo "$dupes"
              fail=1
            fi
          }
          check contracts/errors/errors.json '.errorCodes[].code'
          check contracts/functions/functions.json '.functions[].name'
          check contracts/features/feature-flags.json '.flags[].key'
          exit $fail

  container-build:
    name: Container build check
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API container (validation only — no push)
        run: docker build -f services/api/Dockerfile -t carcommunity-api:build-check .
