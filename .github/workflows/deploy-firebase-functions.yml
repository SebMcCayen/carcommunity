name: Deploy Firebase Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-functions:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-functions-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure WIF secrets are configured
        # Fail loudly with the actual cause — google-github-actions/auth's own
        # error ("must specify exactly one of ...") reads like a workflow bug
        # when the real problem is the missing one-time WIF provisioning.
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::WIF_PROVIDER / WIF_SERVICE_ACCOUNT are not set in the 'production' environment. Run scripts/setup-wif.sh (one-time GCP provisioning) and store both secrets — see docs/deployment.md."
            exit 1
          fi
          # The WIF provider only exchanges tokens for refs/heads/main
          # (scripts/setup-wif.sh attribute condition) — a workflow_dispatch
          # from any other ref would fail at auth with an opaque permissions
          # error, so mirror that restriction here.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys only run from main (WIF token exchange is restricted to refs/heads/main); got $GITHUB_REF."
            exit 1
          fi

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: functions
        run: pnpm install --frozen-lockfile

      - name: Check deploy lockfile
        # Last line of defence before upload: the Cloud Build for this deploy
        # runs `npm ci` against functions/package-lock.json, so refuse to
        # deploy if that lockfile does not pin the CI-tested versions.
        working-directory: functions
        run: pnpm run lockfile:check

      - name: Build
        working-directory: functions
        run: pnpm run build

      - name: Deploy Cloud Functions
        # Run from the repo root so firebase-tools auto-discovers ./firebase.json,
        # whose functions source ("functions") sits inside the project directory.
        #
        # Retry wrapper: a full deploy touches all ~170 functions, which routinely
        # trips the Cloud Functions "Per project mutation requests per minute per
        # region" quota (HTTP 429) mid-rollout. firebase-tools retries internally
        # but can exhaust its budget with a handful of functions still throttled,
        # exiting non-zero even though nothing is actually broken. A manual re-run
        # always converges because `firebase deploy` is idempotent — the next
        # attempt only re-touches the functions that still differ, so it issues
        # far fewer mutations and stays under the per-minute quota. Automate that:
        # retry the same command up to 3 times, pausing 90s (> the 60s quota
        # window) between attempts so the mutation budget refills.
        run: |
          set +e
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::Deploy attempt $attempt/$max_attempts"
            ./functions/node_modules/.bin/firebase deploy --only functions --project kungsbacka-car-community --non-interactive
            status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "::warning::Deploy attempt $attempt failed (exit $status) — likely the per-minute mutation quota. Waiting 90s for the quota window to reset before retrying."
              sleep 90
            fi
            attempt=$((attempt + 1))
          done
          echo "::error::Functions deploy still failing after $max_attempts attempts."
          exit 1
