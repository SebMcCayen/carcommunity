name: Build Android Release

# Produces the Android release App Bundle (AAB), wiring the real Firebase
# project via google-services.json pulled from the production environment
# secret (never committed to the repo — see apps/android/README.md).
#
# Security model:
#  - Manual dispatch only. There is deliberately NO pull_request/push trigger,
#    so an untrusted branch or fork PR can never run this workflow and pull the
#    secrets into an attacker-controlled build.
#  - All secrets are ENVIRONMENT secrets in `production`; the job opts into that
#    environment, so it also inherits the environment's protection + deployment
#    branch rules (e.g. main-only, required reviewers).
#  - Least-privilege GITHUB_TOKEN (contents: read only); no checkout credential
#    persistence; every decoded secret file is removed after the build.
#
# This produces a SIGNED release AAB, ready to upload to Google Play. The upload
# keystore (base64) + its passwords and the Mapbox runtime token are all
# `production` environment secrets, materialized on disk only for the build and
# removed afterwards. If the Mapbox secret is unset the build still succeeds with
# a blank-map token (empty is valid); if the keystore secrets are missing the
# build fails fast rather than silently shipping an unsigned bundle.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you cutting this build? (logged only)'
        required: false
        default: 'manual release build'

# Least privilege: only read the repo and upload an artifact.
permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-release:
    name: build-android-release
    runs-on: ubuntu-latest
    # Scopes ANDROID_GOOGLE_SERVICES_JSON to this job and applies the
    # production environment's protection + branch rules. Because there is no
    # PR trigger, the secret is never exposed to untrusted workflow runs.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Materialize google-services.json from the production secret
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON is not set in the production environment."
            exit 1
          fi
          # Decode to file — never echo the contents. base64 -d tolerates line wrapping.
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > apps/android/app/google-services.json
          # Guard against a wrong/corrupt secret without printing the file (jq -e sets exit code).
          # `client` may hold multiple entries in any order, so match ANY Android
          # client with the expected package name rather than assuming index 0.
          jq -e 'any(.client[]?; .client_info.android_client_info.package_name == "com.kungsbackacarcommunity.app")' \
            apps/android/app/google-services.json > /dev/null \
            || { echo "::error::Decoded google-services.json is not valid for com.kungsbackacarcommunity.app."; exit 1; }
          echo "google-services.json materialized and validated."

      - name: Materialize upload keystore + signing config from production secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Restrictive umask so the secret-bearing files below are created mode
          # 600 (not group/world-readable to other processes on the runner).
          umask 077
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are not fully set in the production environment (need ANDROID_KEYSTORE_BASE64/PASSWORD, ANDROID_KEY_ALIAS/PASSWORD)."
            exit 1
          fi
          # Decode the keystore — never echo it. base64 -d tolerates line wrapping.
          # pipefail aborts the step if base64 -d fails instead of writing a broken file.
          printf '%s' "$KEYSTORE_B64" | base64 -d > apps/android/app/upload-keystore.jks
          # Write the gitignored keystore.properties the signingConfig reads. Use
          # printf (not a heredoc) so secret values are written verbatim, and an
          # absolute storeFile path so file() resolves it regardless of CWD.
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/apps/android/app/upload-keystore.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > apps/android/app/keystore.properties
          echo "upload keystore + keystore.properties materialized."

      - name: Build release bundle (AAB)
        working-directory: apps/android
        # ORG_GRADLE_PROJECT_* exposes each token to Gradle as a project property.
        #
        #  - MAPBOX_ACCESS_TOKEN  — the RUNTIME token (public map tiles). Unset ->
        #    empty -> blank map, but the build still succeeds.
        #
        #  - MAPBOX_DOWNLOADS_TOKEN — the BUILD-TIME secret (`sk.` token, scope
        #    DOWNLOADS:READ) that authenticates Gradle's resolution of the Mapbox
        #    Navigation SDK v3 artifacts (see settings.gradle.kts + app/build.gradle.kts
        #    `navSdkEnabled`). When PRESENT, the real in-app turn-by-turn source set
        #    (src/nav) is compiled and BuildConfig.NAV_SDK_ENABLED is true, so the
        #    route-preview "Start" button drives turn-by-turn INSIDE the app. When
        #    ABSENT (secret unset), the token is empty, the token-less src/noNav stub
        #    is compiled, and "Start" hands off to the device's maps app — the build
        #    still succeeds either way — which makes this the single switch that
        #    ships in-app navigation. The secret IS now set in the `production`
        #    environment, so release builds compile the real src/nav; removing it
        #    (or setting it empty) would silently downgrade releases back to the
        #    hand-off stub without failing the build. `src/nav` is
        #    also compiled on PRs by the `nav-variant-compile` job in
        #    validate-android.yml, so a compile error there no longer waits for a
        #    release build to surface.
        env:
          ORG_GRADLE_PROJECT_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Verify the AAB is signed
        run: |
          set -euo pipefail
          AAB=apps/android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "::error::Release AAB not found at $AAB."
            exit 1
          fi
          # Assert the v1 JAR signature is present (a META-INF/<ALIAS>.RSA|EC|DSA
          # signature block AND its matching META-INF/<ALIAS>.SF) rather than
          # running `jarsigner -verify`. jarsigner trips on a BENIGN "signed in
          # JarFile but is not signed in JarInputStream" discrepancy for App
          # Bundles — its random-access and streaming passes disagree on entry
          # ordering — and `-strict` turns that into a non-zero exit even though
          # every entry IS signed by the upload key. Play does the authoritative
          # signature check on upload and re-signs with the Play App Signing key,
          # so a present-and-complete signature block is the correct,
          # deterministic gate here.
          #
          # We list RAW zip entry paths with `unzip -Z1` (zipinfo mode, one bare
          # entry per line) instead of parsing the tabular `unzip -l` output, and
          # we require the .SF that matches the block's base name — a block alone
          # can pass even when the .SF is missing or corrupt.
          #
          # Capture the entry list ONCE via command substitution (unzip runs to
          # completion — no SIGPIPE), then match against it with here-strings.
          # Feeding grep from a here-string means `grep -q` exiting early has no
          # upstream process to kill, so it can't SIGPIPE a `unzip` under
          # `pipefail` into a false non-zero — a live `unzip -Z1 | grep -q` pipe
          # would (grep -q closes the pipe, unzip dies with SIGPIPE/141, and with
          # pipefail the whole pipeline is non-zero, failing a correctly-signed
          # AAB). The .SF check also uses FIXED-STRING whole-line matching so
          # regex metacharacters in the alias (which is unconstrained — it comes
          # from the keystore) can't break or spoof the match.
          entries="$(unzip -Z1 "$AAB")"
          block="$(grep -iE '^META-INF/[^/]+\.(rsa|ec|dsa)$' <<< "$entries" | head -n1 || true)"
          if [ -z "$block" ]; then
            echo "::error::Release AAB has no signature block — signing did not run (check the ANDROID_KEYSTORE_* secrets)."
            exit 1
          fi
          # Derive the block's base name (alias) and require the matching .SF.
          # Match the exact expected path as a FIXED STRING (grep -F), case-
          # insensitively (-i, for .SF/.sf and alias case) and whole-line (-x, so
          # UPLOAD.SF can't partial-match a decoy UPLOAD.SFX). No regex, so an
          # alias containing '.', '*', '[', etc. is matched literally.
          base="$(basename "$block")"; base="${base%.*}"
          sf="META-INF/${base}.SF"
          if grep -F -i -x -q "$sf" <<< "$entries"; then
            echo "Release AAB is signed — signature block + matching .SF present:"
            echo "  $block"
            grep -F -i -x "$sf" <<< "$entries" | sed 's/^/  /' || true
          else
            echo "::error::Signature block ${block} present but matching ${sf} is missing — signing is incomplete or corrupt."
            exit 1
          fi

      - name: Remove decoded secrets from disk
        if: always()
        run: |
          rm -f apps/android/app/google-services.json
          rm -f apps/android/app/upload-keystore.jks
          rm -f apps/android/app/keystore.properties

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
