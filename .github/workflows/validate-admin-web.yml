name: Validate Admin Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/shared/**'
      - 'firebase.json'
      - '.github/workflows/validate-admin-web.yml'
  # Intentionally no `branches:` filter: every PR runs CI regardless of its
  # base branch, so stacked PRs (base = another feature branch) are verified
  # too. A branch allowlist silently skips CI for any new naming scheme.
  # The `paths:` filter below still scopes this to relevant changes.
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'packages/shared/**'
      - 'firebase.json'
      - '.github/workflows/validate-admin-web.yml'

permissions:
  contents: read

jobs:
  validate-admin-web:
    name: validate-admin-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @carcommunity/shared

      - name: Lint
        run: npm run lint --workspace apps/admin

      - name: Type check
        run: npm run typecheck --workspace apps/admin

      - name: Unit tests
        run: npm test --workspace apps/admin

      - name: Build
        run: npm run build --workspace apps/admin

      - name: Validate hosting configuration (Phase 14)
        # firebase.json hosting became a two-site ARRAY (admin + the public
        # events site) with the public event pages; the validator locates each
        # entry by target (accepting the old single-object shape too), keeps
        # every original admin assertion, and sanity-checks the events entry.
        run: |
          node -e "
          const config = require('./firebase.json');
          const entries = Array.isArray(config.hosting) ? config.hosting : [config.hosting];
          const fail = (msg) => { console.error('FAIL: ' + msg); process.exit(1); };
          const hosting = entries.find((h) => h?.target === 'admin');
          if (!hosting) fail('no hosting entry with target admin (deploy targets the admin site)');
          if (hosting.public !== 'apps/admin/dist') fail('admin hosting.public must point at the admin dist');
          if (!hosting.rewrites?.some((r) => r.source === '**' && r.destination === '/index.html'))
            fail('SPA rewrite missing');
          const globalHeaders = hosting.headers?.find((h) => h.source === '**')?.headers ?? [];
          for (const required of ['Strict-Transport-Security', 'Content-Security-Policy',
                                  'X-Content-Type-Options', 'X-Frame-Options', 'Referrer-Policy']) {
            if (!globalHeaders.some((h) => h.key === required)) fail('missing header: ' + required);
          }
          const assetHeaders = hosting.headers?.find((h) => h.source === '/assets/**')?.headers ?? [];
          if (!assetHeaders.some((h) => h.key === 'Cache-Control' && h.value.includes('immutable')))
            fail('immutable asset caching missing');
          const indexHeaders = hosting.headers?.find((h) => h.source === '/index.html')?.headers ?? [];
          if (!indexHeaders.some((h) => h.key === 'Cache-Control' && h.value.includes('no-store')))
            fail('index.html must be no-store (stale SPA entrypoints after deploys otherwise)');
          const events = entries.find((h) => h?.target === 'events');
          if (events) {
            if (events.public !== 'apps/public-events') fail('events hosting.public must be apps/public-events');
            if (!events.rewrites?.some((r) => r.source === '/e/**' && r.function?.functionId === 'publicweb-eventPage'))
              fail('events site must rewrite /e/** to publicweb-eventPage');
            const eventsHeaders = events.headers?.find((h) => h.source === '**')?.headers ?? [];
            for (const required of ['Strict-Transport-Security', 'X-Content-Type-Options',
                                    'X-Frame-Options', 'Referrer-Policy']) {
              if (!eventsHeaders.some((h) => h.key === required)) fail('events site missing header: ' + required);
            }
          }
          console.log('hosting configuration OK');
          "

      - name: Assert build output shape
        run: |
          test -f apps/admin/dist/index.html || { echo 'FAIL: dist/index.html missing'; exit 1; }
          ls apps/admin/dist/assets/*.js >/dev/null 2>&1 || { echo 'FAIL: hashed assets missing'; exit 1; }
          echo 'build output OK'
