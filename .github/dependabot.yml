version: 2

updates:
  # All npm workspaces: root, packages/shared, apps/mobile, apps/admin, services/api.
  # These share the single root package-lock.json, so they MUST be one update entry:
  # separate per-workspace entries each regenerate the shared lockfile and their PRs
  # race each other on merge (see the vite ^8.1.2/^8.1.3 lockfile breakage fixed in #198).
  # Dependabot discovers workspace members from the root package.json "workspaces" field.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Europe/Stockholm'
    # Keep concurrent lockfile-touching PRs low to shrink the stale-base merge window.
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    # Ignore rules apply across all npm workspaces (Dependabot cannot scope them
    # per workspace within a single entry).
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # services/api: Prisma 7 migration deferred
      - dependency-name: 'prisma'
        versions:
          - '7.x'
      - dependency-name: '@prisma/client'
        versions:
          - '7.x'
      - dependency-name: '@prisma/adapter-pg'
        versions:
          - '7.x'
      # apps/mobile: Expo SDK majors are upgraded manually as a set
      - dependency-name: 'expo'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-native'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'expo-constants'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'expo-status-bar'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-native-gesture-handler'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-native-safe-area-context'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-native-screens'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint-config-expo'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'jest-expo'
        update-types:
          - 'version-update:semver-major'

  # Firebase Functions workspace — pnpm with its own pnpm-lock.yaml, so it does not
  # contend with the root package-lock.json and stays a separate entry.
  - package-ecosystem: 'npm'
    directory: '/functions'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:35'
      timezone: 'Europe/Stockholm'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'functions'
      - 'npm'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'firebase-admin'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'firebase-functions'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'firebase'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'firebase-tools'
        update-types:
          - 'version-update:semver-major'

  # GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:30'
      timezone: 'Europe/Stockholm'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
