# XcodeGen project specification — the source of truth for KCC.xcodeproj.
#
# The generated KCC.xcodeproj is committed so plain Xcode works out of the box;
# after editing this file, regenerate with `xcodegen generate` (run from
# apps/ios) and commit both. CI will diff-check the two once the iOS validation
# workflow lands (mirroring the contracts codegen drift checks).
name: KCC
options:
  developmentLanguage: sv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0

targets:
  KCC:
    type: application
    platform: iOS
    sources:
      - path: KCC
    dependencies:
      - package: Firebase
        product: FirebaseAuth
    info:
      path: KCC/Info.plist
      properties:
        CFBundleDisplayName: Kungsbacka Car Community
        CFBundleDevelopmentRegion: sv
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kungsbackacarcommunity.app
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        # Script phases (GoogleService-Info.plist embedding below) copy into the
        # built product, which the default script sandbox forbids.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # The config-less-build seam (parity with Android's gitignored
      # google-services.json): GoogleService-Info.plist is NOT referenced by the
      # project. When the gitignored file exists locally (or is injected from a
      # CI secret) it is copied into the app bundle; when absent the app still
      # builds and runs with Firebase-backed features disabled
      # (FirebaseBootstrap.configureIfAvailable finds no plist).
      - name: Embed GoogleService-Info.plist when present
        script: |
          SRC="${SRCROOT}/KCC/GoogleService-Info.plist"
          if [ -f "$SRC" ]; then
            cp "$SRC" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
            echo "GoogleService-Info.plist embedded"
          else
            echo "GoogleService-Info.plist absent — building without Firebase config"
          fi
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - KCCTests

  KCCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KCCTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KCC
