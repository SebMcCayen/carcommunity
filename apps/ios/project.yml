# XcodeGen project specification — the source of truth for KCC.xcodeproj.
#
# The generated KCC.xcodeproj is committed so plain Xcode works out of the box;
# after editing this file, regenerate with `xcodegen generate` (run from
# apps/ios) and commit both. CI will diff-check the two once the iOS validation
# workflow lands (mirroring the contracts codegen drift checks).
name: KCC
options:
  developmentLanguage: sv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Project-level settings so every target (and any future one) inherits the
# same Swift language mode instead of Xcode's Swift 5 default.
settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  MapboxMaps:
    # The binary distribution keeps local and CI builds fast. Pin this to the
    # same Maps SDK version as Android and to a release built for Xcode 26.3.
    url: https://github.com/mapbox/mapbox-maps-ios-binary.git
    exactVersion: 11.26.0

targets:
  KCC:
    type: application
    platform: iOS
    sources:
      - path: KCC
    dependencies:
      # App Check protects authenticated callables. Its provider factory is
      # installed before FirebaseApp.configure in FirebaseBootstrap.
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      # Events read path: direct Firestore snapshot listeners, mirroring
      # Android's FirebaseEventsRepository.
      - package: Firebase
        product: FirebaseFirestore
      # Callable seam (KccFunctionsClient) — every KCC callable lives in
      # europe-west1.
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseInstallations
      # Avatar rendering: stored Storage PATHS resolve to download URLs at
      # render time (FirebaseUserProfileRepository.avatarDownloadURL),
      # mirroring Android's media/StorageImageUrl.
      - package: Firebase
        product: FirebaseStorage
      # Live location: the caller's own session node is READ from Realtime
      # Database (liveLocation/{uid}/session — FirebaseLiveLocationRepository),
      # mirroring Android's FirebaseLiveLocationRepository; all live writes go
      # through callables.
      - package: Firebase
        product: FirebaseDatabase
      # Symbolicated fatal and non-fatal release diagnostics. Debug collection
      # is disabled below so developer crashes do not pollute production data.
      - package: Firebase
        product: FirebaseCrashlytics
      - package: MapboxMaps
        product: MapboxMaps
    info:
      path: KCC/Info.plist
      properties:
        CFBundleDisplayName: Kungsbacka Car Community
        CFBundleDevelopmentRegion: sv
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Firebase Messaging 12.18's supported registration API is FID-based.
        # Without this opt-in register()/unregister() fail and only the now-
        # deprecated token API is available.
        FirebaseMessagingInstallationIdEnabled: true
        # Public runtime token only (pk....). Inject MAPBOX_ACCESS_TOKEN as a
        # user-defined build setting; an absent/invalid token deliberately
        # leaves the config-less map placeholder active for CI.
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        # Single-source the version from the build settings below.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Location purpose string (when-in-use only). The base value is the
        # SWEDISH text of the contract key `map.locationPermissionBody` —
        # the same rationale Android shows at runtime — and it is localized
        # (sv + en, same contract values) via the HAND-WRITTEN
        # KCC/Resources/InfoPlist.xcstrings: the strings generator owns only
        # Localizable.xcstrings, and .xcstrings files are JSON with no room
        # for comments, so this note and the README's Localization section
        # are that catalog's documentation. Keep all three in sync with the
        # contract.
        #
        # Deliberately NO NSLocationAlwaysAndWhenInUseUsageDescription:
        # Android runs live sharing on a location-typed foreground service
        # WITHOUT ACCESS_BACKGROUND_LOCATION (see LocationSharingService),
        # and the iOS analogue used by dedicated, user-started drive/live
        # sessions is the `location` UIBackgroundMode on a when-in-use grant
        # — not Always.
        NSLocationWhenInUseUsageDescription: "Utan platsåtkomst kan kartan inte visa var du är, och vägbeskrivningar, körinspelning och livedelning fungerar inte."
        FirebaseCrashlyticsCollectionEnabled: $(CRASHLYTICS_COLLECTION_ENABLED)
        UIBackgroundModes:
          - location
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kungsbackacarcommunity.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: KCC/KCC.entitlements
        OTHER_LDFLAGS: $(inherited) -ObjC
        # Keep script phases sandboxed; the GoogleService-Info.plist embedding
        # phase below declares its input/output files so the sandbox permits
        # exactly that copy and nothing else.
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          APP_ATTEST_ENVIRONMENT: development
          APS_ENVIRONMENT: development
          CRASHLYTICS_COLLECTION_ENABLED: NO
        Release:
          APP_ATTEST_ENVIRONMENT: production
          APS_ENVIRONMENT: production
          CRASHLYTICS_COLLECTION_ENABLED: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    postBuildScripts:
      # The config-less-build seam (parity with Android's gitignored
      # google-services.json): GoogleService-Info.plist is NOT referenced by the
      # project. When the gitignored file exists locally (or is injected from a
      # CI secret) it is copied into the app bundle; when absent the app still
      # builds and runs with Firebase-backed features disabled
      # (FirebaseBootstrap.configureIfAvailable finds no plist).
      - name: Embed GoogleService-Info.plist when present
        script: |
          SRC="${SRCROOT}/KCC/GoogleService-Info.plist"
          DST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
            echo "GoogleService-Info.plist embedded"
          else
            # Also remove any copy left in the product by an earlier build, so
            # deleting the local plist really returns to a config-less build.
            rm -f "$DST"
            echo "GoogleService-Info.plist absent — building without Firebase config"
          fi
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/KCC/GoogleService-Info.plist
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
      # Keep this last: Crashlytics needs the final release dSYM. Config-less
      # CI/local builds deliberately skip the upload.
      - name: Upload release dSYMs to Crashlytics
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            echo "Crashlytics dSYM upload skipped for ${CONFIGURATION}"
            exit 0
          fi

          GOOGLE_SERVICE_INFO="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          if [ ! -f "${GOOGLE_SERVICE_INFO}" ]; then
            echo "GoogleService-Info.plist absent — Crashlytics dSYM upload skipped"
            exit 0
          fi

          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
    scheme:
      testTargets:
        - KCCTests
        - KCCUITests

  KCCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KCCTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KCC
      # KccFunctionsErrorTests exercises the SDK-to-contract error seam with
      # a real FunctionsErrorDomain NSError.
      - package: Firebase
        product: FirebaseFunctions

  KCCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KCCUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KCC
