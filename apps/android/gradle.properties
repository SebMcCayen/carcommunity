# JVM options for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin compiles in a separate daemon. Give Compose bytecode optimization its
# own bounded heap instead of inheriting Gradle's 2 GiB (FixStack OOM in CI).
kotlin.daemon.jvmargs=-Xmx3072m

# `test` includes debug and release compilation. Serialize worker actions so
# their compiler memory does not overlap; keep both variants and all CI gates.
org.gradle.workers.max=1

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Generate a non-transitive R class (each module only exposes its own resources)
android.nonTransitiveRClass=true
