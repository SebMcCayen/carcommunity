# Global Robolectric config for the JVM Compose UI test suite.
#
# sdk=34: Robolectric 4.14.1 ships sandbox jars up to Android 34, so JVM tests
# run under SDK 34 even though the app compiles against compileSdk 36. This is
# independent of the app's targetSdk (35) and only affects the Robolectric
# runtime the tests execute on.
#
# graphicsMode=NATIVE: Compose measures/lays out real pixels, so it needs
# Robolectric's native graphics backend; the default LEGACY (no-op canvas) makes
# Compose assertions unreliable. Applies to every Robolectric test in this module.
sdk=34
graphicsMode=NATIVE
